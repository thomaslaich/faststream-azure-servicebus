[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "faststream-azure-servicebus"
description = "Azure Service Bus broker for FastStream"
readme = "README.md"
license = "MIT"
authors = [{ name = "Thomas Laich", email = "thomaslaich@gmail.com" }]
keywords = [
  "faststream",
  "azure",
  "service bus",
  "servicebus",
  "amqp",
  "asyncapi",
  "message broker",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
requires-python = ">=3.10"
dynamic = ["version"]

dependencies = ["faststream>=0.7.0,<0.8.0", "azure-servicebus>=7.14.0,<8.0.0"]

[project.optional-dependencies]
identity = ["azure-identity>=1.19.0"]
otel = ["faststream[otel]>=0.7.0,<0.8.0"]
prometheus = ["faststream[prometheus]>=0.7.0,<0.8.0"]

[project.urls]
Homepage = "https://github.com/thomaslaich/faststream-azure-servicebus"
Source = "https://github.com/thomaslaich/faststream-azure-servicebus"
Tracker = "https://github.com/thomaslaich/faststream-azure-servicebus/issues"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/faststream_azure_servicebus"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"

[dependency-groups]
lint = ["ruff==0.14.14", "ty==0.0.72"]
examples = [
  "msgpack>=1.0.0,<2.0.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.24.0,<2.0.0",
  "opentelemetry-sdk>=1.24.0,<2.0.0",
]

test = [
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "pytest-cov>=5.0.0",
  "pytest-xdist>=3.8.0",
  "pytest-timeout>=2.4.0",
  "pytest-rerunfailures>=15.1",
  "testcontainers>=4.13.0,<5.0.0",
  "dirty-equals==0.11",
  "azure-identity>=1.19.0",
  "opentelemetry-sdk>=1.24.0,<2.0.0",
  "prometheus-client>=0.20.0,<0.30.0",
]

dev = [
  { include-group = "lint" },
  { include-group = "test" },
  { include-group = "examples" },
  "rust-just==1.58.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
timeout = 60
addopts = "--strict-markers --strict-config -q"
testpaths = ["tests"]
markers = [
  "slow",
  "connected: requires a running Service Bus emulator or namespace",
  "all",
]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["faststream_azure_servicebus"]

[tool.coverage.report]
fail_under = 90

[tool.ty.environment]
python-version = "3.10"
root = ["./src"]

[tool.ty.src]
include = ["src"]
