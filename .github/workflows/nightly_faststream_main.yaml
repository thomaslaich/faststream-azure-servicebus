# faststream-azure-servicebus subclasses types under `faststream._internal`, which is
# private API with no compatibility guarantee. This job runs the suite against
# faststream's main branch so upstream drift shows up as a red build here rather than
# as a bug report from a user.
name: Nightly (faststream@main)
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: latest
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: uv sync --group test
      - name: Install faststream from main
        run: uv pip install --reinstall "faststream @ git+https://github.com/ag2ai/faststream.git@main"
      - run: uv run --no-sync just test-offline-ci -vv
      - run: uv run --no-sync just test-connected-ci -vv
