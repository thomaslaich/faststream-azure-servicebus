name: PR Validation
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Configure devenv cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - run: devenv shell -- just ci
  test-offline:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: latest
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --group test
      - run: uv run just test-offline-ci -vv
      - name: Rename coverage file
        run: mkdir coverage && mv .coverage coverage/.coverage.offline.py${{ matrix.python-version }}
      - uses: actions/upload-artifact@v7
        with:
          name: .coverage.offline.py${{ matrix.python-version }}
          path: coverage
          if-no-files-found: error
          include-hidden-files: true
  test-connected:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Start the Service Bus emulator
        run: docker compose up -d --wait
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: latest
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --group test
      - run: uv run just test-connected-ci -vv
      - name: Dump emulator logs on failure
        if: failure()
        run: docker compose logs servicebus
      - name: Rename coverage file
        run: mkdir coverage && mv .coverage coverage/.coverage.connected.py3.13
      - uses: actions/upload-artifact@v7
        with:
          name: .coverage.connected.py3.13
          path: coverage
          if-no-files-found: error
          include-hidden-files: true
  coverage:
    if: github.event.pull_request.draft == false
    needs: [test-offline, test-connected]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: latest
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --group test
      - uses: actions/download-artifact@v8
        with:
          pattern: .coverage*
          path: coverage
          merge-multiple: true
      - run: uv run just coverage-ci
  validate:
    if: always() && github.event.pull_request.draft == false
    needs: [lint, test-offline, test-connected, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test-offline.result }}" = "success"
          test "${{ needs.test-connected.result }}" = "success"
          test "${{ needs.coverage.result }}" = "success"
